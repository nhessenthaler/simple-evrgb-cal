;Filename: intrinsic_calibration_12mm_prophesee.ini
;Author: Nico Hessenthaler
;Date: 2026-06-05
;Version: 1.0
;Description:
;    Parameters required for the intrinsic calibration of a prophesee camera with 12 mm lens using an UR5e robotic arm.
;License: Apache License Version 2.0
;Contact: nico.hessenthaler@hs-heilbronn.de

[prophesee_lens]
# float: Focal length of the camera lens in meters.
# Default: TBD
# Unit: m
focal_length = TBD


[prophesee_calibration]
# float: Positional offset compared to the uEye camera in meters. This is required to ensure that the robot arm moves to the correct positions during the calibration process, as the Prophesee camera is not mounted at the same position as the uEye camera.
# The offset should be measured from the center of the uEye camera lens to the center of the Prophesee camera lens. The offset should be measured in the x, y and z direction.
# Default: Depends on the camera and scene.
# Unit: m
positional_offset_x = TBD

# float: Distance to the surface of the target pattern displayed on a monitor. (Orthogonal to the optical axis of the camera)
# Default: TBD
# Unit: m
distance_to_target = TBD

# int: Number of rows the robot arm should move to during the calibration process. Derived
# from the minimum number of pictures required for the calibration process. The robot arm will move to a new position after each picture is taken.
# Metavision SDK requires at least 50 pictures for the calibration process. With 10 columns, this results in at least 5 rows.
# HINT: MUST BE ODD
# Default: 3
# Unit: -
calibration_rows = 3

# int: Number of columns the robot arm should move to during the calibration process. Derived
# from the minimum number of pictures required for the calibration process. The robot arm will move to a new position after each picture is taken.
# Metavision SDK requires at least 50 pictures for the calibration process. With 5 rows, this results in at least 10 columns.
# HINT: MUST BE ODD
# Default: 3
# Unit: -
calibration_columns = 3

# int: Number of depth positions the robot arm should move to during the depth calibration process. Derived
# from the minimum number of pictures required for the depth calibration process. The robot arm will move to a new position after each picture is taken.
# Metavision SDK requires at least 50 pictures for the depth calibration process.
# Default: 5
# Unit: -
calibration_depth_positions = 5

# int: Divisor factor for the step size in depth direction during the depth calibration process. The step size in depth direction will be calculated by dividing the distance to the target by the divisor factor.
# This is required to ensure that the robot arm moves in small steps in depth direction during the depth calibration process, which is important for the accuracy of the depth calibration process.
# Default: 35
# Unit: -
depth_step_divisor = 35

# int: Number of depth positions the robot arm should move to during the depth calibration process. Derived
# from the minimum number of pictures required for the depth calibration process. The robot arm will move to a new position after each picture is taken.
# Metavision SDK requires at least 50 pictures for the depth calibration process.
# Default: 5
# Unit: -
calibration_rotation_positions = 5

# float: Maximum roll angle the camera rotates in total (50 % in each direction) during the rotation calibration process.
# This is required to ensure that the robot arm does not rotate too much during the rotation calibration.
# This value might depend on the camera and the scene.
# Default: 8
# Unit: deg
max_roll = 8

# float: Maximum pitch angle the camera rotates in total (50 % in each direction) during the rotation calibration process.
# This is required to ensure that the robot arm does not rotate too much during the rotation calibration.
# This value might depend on the camera and the scene.
# Default: 10
# Unit: deg
max_pitch = 10

# float: Maximum yaw angle the camera rotates in total (50 % in each direction) during the rotation calibration process.
# This is required to ensure that the robot arm does not rotate too much during the rotation calibration.
# This value might depend on the camera and the scene.
# Default: 45
# Unit: deg
max_yaw = 45

# float: Time that the robot arm moves to the next position during the calibration process. 
# The robot arm will move to a new position after each picture is taken. Determines velocity and acceleration of the robot arm.
# Velocity and acceleration will be calculated by the robot controller based on the move time and the distance to the next position.
# Default: 1.0
# Unit: s
move_time = 1.0

# float: Time that the robot arm takes to move to the first position during the calibration process.
# The robot arm will move to the first position before the calibration process starts. Determines velocity and acceleration of the robot arm for the first move.
# Velocity and acceleration will be calculated by the robot controller based on the move time and the distance to the first position.
# WARNING: Choose a high time for the first move to ensure that the robot arm moves slowly and does not cause any damage to the camera or the environment.
# Default: 5.0
# Unit: s
move_time_start = 3.0

# float: Time that the robot arm takes to move to the first position during the depth calibration process.
# The robot arm will move to the first position before the depth calibration process starts. Determines velocity and acceleration of the robot arm for the first move.
# Velocity and acceleration will be calculated by the robot controller based on the move time and the distance to the first position.
# WARNING: Choose a high time for the first move to ensure that the robot arm moves slowly and does not cause any damage to the camera or the environment.
# Default: 2.0
# Unit: s
move_time_start_depth = 2.0

# float: Half of the time that the robot arm waits at each position during the calibration process.
# The robot arm will wait at each position for a certain amount of time after moving to the next position. 
# This is required to ensure that the robot arm is stable and does not move during the calibration process. 
# The robot arm will wait at each position for the specified amount of time before taking a picture and as well as after taking a picture.
wait_time = 1.5

# float: Z position for extra calibration position 1 (overrides base_z).
# Default: 0.594
# Unit: m
extra_pos1_z = 0.594

# float: RY orientation for extra calibration position 1 (overrides base_ry).
# Default: -0.8
# Unit: rad
extra_pos1_ry = -0.8

# float: Z position for extra calibration position 2 (overrides base_z).
# Default: 0.317
# Unit: m
extra_pos2_z = 0.317

# float: RY orientation for extra calibration position 2 (overrides base_ry).
# Default: 0.278
# Unit: rad
extra_pos2_ry = 0.278

# float: X position for extra calibration position 3 (overrides base_x).
# Default: 0.317
# Unit: m
extra_pos3_x = 0.317

# float: RZ orientation for extra calibration position 3 (overrides base_rz).
# Default: 2.75
# Unit: rad
extra_pos3_rz = 2.75

# float: X position for extra calibration position 4 (overrides base_x).
# Default: 0.015
# Unit: m
extra_pos4_x = 0.015

# float: RZ orientation for extra calibration position 4 (overrides base_rz).
# Default: 3.48
# Unit: rad
extra_pos4_rz = 3.48

# float: X position for diagonal calibration position 1.
# Default: -0.044
# Unit: m
diag_pos1_x = -0.044

# float: Z position for diagonal calibration position 1.
# Default: 0.499
# Unit: m
diag_pos1_z = 0.499

# float: RX orientation for diagonal calibration position 1.
# Default: 0.123
# Unit: rad
diag_pos1_rx = 0.123

# float: RY orientation for diagonal calibration position 1.
# Default: 0.403
# Unit: rad
diag_pos1_ry = 0.403

# float: RZ orientation for diagonal calibration position 1.
# Default: -2.686
# Unit: rad
diag_pos1_rz = -2.686

# float: X position for diagonal calibration position 2.
# Default: 0.305
# Unit: m
diag_pos2_x = 0.305

# float: Z position for diagonal calibration position 2.
# Default: 0.270
# Unit: m
diag_pos2_z = 0.270

# float: RX orientation for diagonal calibration position 2.
# Default: 0.278
# Unit: rad
diag_pos2_rx = 0.278

# float: RY orientation for diagonal calibration position 2.
# Default: -0.533
# Unit: rad
diag_pos2_ry = -0.533

# float: RZ orientation for diagonal calibration position 2.
# Default: -3.431
# Unit: rad
diag_pos2_rz = -3.431

# float: X position for diagonal calibration position 3.
# Default: 0.305
# Unit: m
diag_pos3_x = 0.305

# float: Z position for diagonal calibration position 3.
# Default: 0.499
# Unit: m
diag_pos3_z = 0.499

# float: RX orientation for diagonal calibration position 3.
# Default: 0.424
# Unit: rad
diag_pos3_rx = 0.424

# float: RY orientation for diagonal calibration position 3.
# Default: -0.455
# Unit: rad
diag_pos3_ry = -0.455

# float: RZ orientation for diagonal calibration position 3.
# Default: 2.763
# Unit: rad
diag_pos3_rz = 2.763

# float: X position for diagonal calibration position 4.
# Default: -0.044
# Unit: m
diag_pos4_x = -0.044

# float: Z position for diagonal calibration position 4.
# Default: 0.270
# Unit: m
diag_pos4_z = 0.270

# float: RX orientation for diagonal calibration position 4.
# Default: 0.061
# Unit: rad
diag_pos4_rx = 0.061

# float: RY orientation for diagonal calibration position 4.
# Default: 0.462
# Unit: rad
diag_pos4_ry = 0.462

# float: RZ orientation for diagonal calibration position 4.
# Default: 3.52
# Unit: rad
diag_pos4_rz = 3.52


[prophesee_position]
# float: Base position along the x-axis in meters.
# Should be chosen such that the half of the targets last row and half of the targets first column
# are visible in the camera image at the bottom left corner of the calibration image.
# Default: Depends on the camera and scene.
# Unit: m
base_x = 0.115

# float: Base position along the y-axis in meters.
# Should be chosen such that the half of the targets last row and half of the targets first column
# are visible in the camera image at the bottom left corner of the calibration image.
# Default: Depends on the camera and scene.
# Unit: m
base_y = -0.409
# float: Base position along the z-axis in meters.
# Should be chosen such that the half of the targets last row and half of the targets first column
# are visible in the camera image at the bottom left corner of the calibration image.
# Default: Depends on the camera and scene.
# Unit: m
base_z = 0.397


[prophesee_orientation]
# float: Base rotation around the x-axis in degrees. 
# Should be chosen such that the camera optical axis is orthogonal to the surface of the target pattern displayed.
# Default: Depends on the camera and scene.
# Unit: deg
base_rx = 0.000

# float: Base rotation around the y-axis in degrees.
# Should be chosen such that the camera optical axis is orthogonal to the surface of the target pattern displayed.
# Default: Depends on the camera and scene.
# Unit: deg
base_ry = 0.000

# float: Base rotation around the z-axis in degrees.
# Should be chosen such that the camera optical axis is orthogonal to the surface of the target pattern displayed.
# Default: Depends on the camera and scene.
# Unit: deg
base_rz = 3.142
