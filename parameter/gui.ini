[data_capture]
# int: Width of the image containers in the data capture GUI.
# Default: 810
# Unit: pixels
image_width = 810

# int: Height of the image containers in the data capture GUI.
# Default: 540
# Unit: pixels
image_height = 540

# int: Height of the image display area in the data capture GUI due to a different aspect ration of the uEye camera and the event camera.
# Default: 455
# Unit: pixels
image_display_height = 455

# int: Image overlay height in the data capture GUI.
# Default: 60
# Unit: pixels
image_overlay_height = 60

# int: Duration in milliseconds for the fade-in and fade-out animation of overlays.
# Default: 300
# Unit: milliseconds
animate_opacity_duration = 300

# float: Duration in seconds after which the overlays will be hidden if the user hovers out.
# Default: 1.5
# Unit: seconds
overlay_hide_delay = 1.5

# int: Size of the shared memory buffers for the base64 encoded event frames and RGB frames, allowing for live updates in the GUI.
# Default: 2000000
# Unit: bytes
b64_shared_memory_size = 2_000_000

# int: Size of the shared memory buffers for the raw event frames and RGB frames, allowing for live updates in the GUI.
# Default: 10000000
# Unit: bytes
raw_shared_memory_size = 10_000_000

# str: The directory where recordings will be saved. The directory will be created if it does not exist.
# Default: recordings
# Unit: -
rgb_recording_directory = C:\\Users\\AI-Student\\Pictures\\Prophesee

# str: The directory where recordings of the event stream will be saved. The directory will be created if it does not exist.
# Default: recordings
# Unit: -
event_recording_directory = C:\\Users\\AI-Student\\Pictures\\Prophesee\\Events


