[flet]
# int: Quality of the jpeg compression.
# Default: 85
# Unit: %
image_quality = 85

# str: Path to the dll of the TurboJPEG library for fast jpeg compression. The dll must be compatible with the system architecture (32-bit or 64-bit).
# Default: C:\\libjpeg-turbo64\\bin\\turbojpeg.dll
# Unit: -
turbojpeg_dll_path = C:\\libjpeg-turbo64\\bin\\turbojpeg.dll



